baseURL = 'https://stringtune.com/'
languageCode = 'en-us'
title = 'StringTune Online Tuner - Best Online Instrument Tuner with microphone'

DefaultContentLanguage = "en"
enableRobotsTXT = true
disableKinds = ["taxonomy", "taxonomyTerm"]
theme = "viko"

[minify]
  enable = true
  minifyCSS = true
  minifyJS = true

[params]
    copyright = "Copyright {year}, Stringtune.com"
    author = "strintune.com"
    # Needed for analytics
    facebook_app_id = "123456789"

[outputs]
  home = ["HTML", "JSON"]

# Text that appears on the home page
[params.home]
title = "strintune.com"
subtitle = "StringTune Online Tuner - Best Online Instrument Tuner with microphone"
intro = ""

# Contact page and footer.
# Also feeds the generated ld+json https://schema.org/Organization which appears on the home page
[params.contact]
org_name = "strintune.com"
email = "hi@strintune.com"
# This appears on the contact page
full_address = ""
# These are used in the footer
street_address = ""
city = ""
post_code = ""
country = ""

# Contact page
[params.contact.phone]
# number appears as href="tel:xxx-xxx-xxx"
number = ""
display = ""

# Contact page
[params.contact.whatsapp]
number = ""
display = ""

# Footer
[params.social]
twitter_url = "https://twitter.com/AndriiShylenko"
# Used for twitter:site field in the twitter cards
twitter_handle = "@andriishylenko"
# Used for twitter:creator field in the twitter cards
author_twitter_handle = "@AndriiShylenko"
facebook_url = "https://www.facebook.com/onlinestringtuner/"
feedback_url = "https://strungtune.canny.io/"

[languages]
  [languages.en]
    title = "StringTune – Free Online String & Instrument Tuner"
    description = "StringTune is a free online instrument tuner: tune guitar, bass or ukulele with your microphone in the browser. No app, no sign-up, reference tones included."
    languageName = "English"
    contentDir = "content/en"
    [languages.en.params]
      ogLocale = "en_US"
      guide = true

  [languages.es]
    title = "Afinador online gratis para guitarra, bajo y ukelele"
    description = "Afinador en línea gratis con micrófono: afina tu guitarra, bajo o ukelele en segundos, sin instalar ni registrarte. Con la nota de referencia de cada cuerda."
    languageName = "Español"
    contentDir = "content/es"
    [languages.es.params]
      ogLocale = "es_ES"
      guide = true

  [languages.fr]
    title = "Accordeur en ligne gratuit – guitare, basse, ukulélé"
    description = "Accordeur en ligne gratuit avec micro : accordez guitare, basse ou ukulélé en quelques secondes, sans appli ni inscription. Note de référence pour chaque corde."
    languageName = "Français"
    contentDir = "content/fr"
    [languages.fr.params]
      ogLocale = "fr_FR"
