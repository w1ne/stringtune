[guide]
other = """
## オンラインでギターをチューニングする3ステップ

1. マイクのボタンを押し、ブラウザでマイクの使用を許可します。
2. 開放弦を1本弾き、音を伸ばしたままにします。チューナーが音名を判定し、低すぎるか高すぎるかを表示します。
3. 針が中央で止まるまで、ペグをゆっくり回します。すべての弦で同じように合わせます。

## ギターのレギュラーチューニング：E A D G B E

太い6弦から細い1弦まで **E2 – A2 – D3 – G3 – B3 – E4**（ミ・ラ・レ・ソ・シ・ミ）です。ベースは E1 – A1 – D2 – G2、ウクレレは G4 – C4 – E4 – A4。メニューで楽器を選ぶと各弦の音名がボタンで表示され、タップすると基準音を聴けます。

## 正確にチューニングするコツ

- 静かな部屋で、音楽やテレビを消してから合わせましょう。
- スマホやパソコンを楽器に近づけます。アコースティックギターならサウンドホールの前、エレキギターならアンプのスピーカーの近くがおすすめです。
- 弦は1本ずつ弾き、ほかの弦は手でミュートします。
- 音は下から合わせます。高すぎるときは一度少し緩めてから、締めながら合わせましょう。
- バイオリン、ビオラ、チェロにも使えます。どの音でも判定できます（バイオリン G D A E、ビオラ・チェロ C G D A）。
- バンドで A4 = 442 Hz に合わせる場合は、「A4 = 440 Hz」をタップして基準ピッチを変更できます。
- マイクが起動しないときは、ブラウザのサイト設定でマイクを許可し、もう一度ボタンを押してください。
"""

