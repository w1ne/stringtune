[guide]
other = """
## Як налаштувати гітару онлайн за 3 кроки

1. Натисніть кнопку з мікрофоном і дозвольте браузеру доступ до мікрофона.
2. Зіграйте одну відкриту струну й дайте їй звучати. Тюнер визначить ноту й покаже, чи вона звучить нижче, чи вище, ніж треба.
3. Повільно крутіть кілок, доки стрілка не зупиниться по центру. Повторіть для кожної струни.

## Стандартний стрій гітари: E A D G B E

Від найтовщої (6-ї) струни до найтоншої (1-ї): **Мі – Ля – Ре – Соль – Сі – Мі**, тобто E2 – A2 – D3 – G3 – B3 – E4 — саме так ноти показує тюнер. Бас-гітара: E1 – A1 – D2 – G2. Укулеле: G4 – C4 – E4 – A4. Оберіть інструмент у меню: ноти з'являться у вигляді кнопок, натисніть будь-яку, щоб почути еталонний звук.

## Поради для точного налаштування

- Налаштовуйте в тихій кімнаті, вимкніть музику й телевізор.
- Тримайте телефон або ноутбук ближче до інструмента: біля резонаторного отвору акустичної гітари або біля динаміка підсилювача електрогітари.
- Грайте по одній струні, а решту приглушуйте рукою.
- Підтягуйте струну до ноти знизу: якщо вона звучить вище, послабте її трохи нижче ноти, а потім підтягніть.
- Скрипка, альт чи віолончель? Тюнер розпізнає будь-яку ноту (скрипка G D A E, альт і віолончель C G D A).
- Ваш гурт строїться від ля = 442 Гц? Натисніть «A4 = 440 Hz», щоб змінити еталонну висоту.
- Якщо мікрофон не вмикається, дозвольте його в налаштуваннях сайту в браузері й натисніть кнопку ще раз.
"""

