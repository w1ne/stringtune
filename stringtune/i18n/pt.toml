[guide]
other = """
## Como afinar o violão online em 3 passos

1. Toque no botão do microfone e permita o acesso quando o navegador pedir.
2. Toque uma corda solta e deixe soar. O afinador reconhece a nota e mostra se ela está grave ou aguda demais.
3. Gire a tarraxa devagar até o ponteiro parar no centro. Repita em cada corda.

## Afinação padrão do violão: Mi Lá Ré Sol Si Mi

Da corda mais grossa (6ª) para a mais fina (1ª): **Mi – Lá – Ré – Sol – Si – Mi**, ou seja, E2 – A2 – D3 – G3 – B3 – E4 na cifra que o afinador usa. A guitarra elétrica usa a mesma afinação. Baixo: Mi Lá Ré Sol (E1 – A1 – D2 – G2). Ukulele: Sol Dó Mi Lá (G4 – C4 – E4 – A4). Escolha o instrumento no menu: as notas aparecem como botões; toque em uma para ouvir a nota de referência.

## Dicas para afinar com precisão

- Afine em um lugar silencioso, sem música nem TV ligada.
- Deixe o celular ou o notebook perto do instrumento: na frente da boca do violão ou perto da caixa do amplificador.
- Toque uma corda de cada vez e abafe as outras com a mão.
- Afine sempre subindo até a nota: se a corda estiver aguda, afrouxe um pouco abaixo da nota e depois estique de novo.
- Cavaquinho, bandolim ou violino? O afinador reconhece qualquer nota (cavaquinho Ré Sol Si Ré, bandolim e violino Sol Ré Lá Mi, viola e violoncelo Dó Sol Ré Lá).
- Sua banda afina em Lá 442 Hz? Toque em “A4 = 440 Hz” para mudar a frequência de referência.
- Se o microfone não funcionar, libere o acesso nas configurações do site no navegador e toque no botão de novo.
"""
