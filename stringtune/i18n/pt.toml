[description]
other = """
Bem-vindo ao StringTune, o afinador online mais fácil de usar. Para começar, permita o acesso ao microfone e toque uma corda de cada vez. O afinador detecta automaticamente a nota tocada e mostra se ela está grave ou aguda. Continue ajustando até o ponteiro ficar no centro. Afinações padrão de vários instrumentos de corda:

- Violão e guitarra: E - A - D - G - B - E
- Baixo: E - A - D - G
- Ukulele: G - C - E - A
- Cavaquinho: D - G - B - D
- Violino: G - D - A - E
- Violoncelo: C - G - D - A
- Viola: C - G - D - A
- Bandolim: G - D - A - E
- Banjo (5 cordas): G - D - G - B - D
"""
