[guide]
other = """
## Gitarre online stimmen in 3 Schritten

1. Tippen Sie auf den Mikrofon-Button und erlauben Sie den Zugriff auf das Mikrofon, wenn der Browser danach fragt.
2. Schlagen Sie eine leere Saite an und lassen Sie sie klingen. Das Stimmgerät erkennt den Ton und zeigt an, ob er zu tief oder zu hoch ist.
3. Drehen Sie langsam am Stimmwirbel, bis die Nadel in der Mitte stehen bleibt. Wiederholen Sie das für jede Saite.

## Standardstimmung der Gitarre: E A D G H E

Von der dicksten Saite (6.) zur dünnsten (1.): **E – A – D – G – H – E**. Das Stimmgerät verwendet die englischen Tonnamen, deshalb erscheint das H als B: E2 – A2 – D3 – G3 – B3 – E4. Bass: E1 – A1 – D2 – G2. Ukulele: G4 – C4 – E4 – A4. Wählen Sie Ihr Instrument im Menü: Die Töne erscheinen als Buttons. Tippen Sie auf einen, um den Referenzton zu hören.

## Tipps für genaues Stimmen

- Stimmen Sie in einem ruhigen Raum, ohne Musik oder Fernseher im Hintergrund.
- Halten Sie Handy oder Laptop nah ans Instrument: vor das Schallloch der Akustikgitarre oder an den Lautsprecher des Verstärkers.
- Spielen Sie immer nur eine Saite und dämpfen Sie die anderen mit der Hand ab.
- Stimmen Sie von unten an den Ton heran: Ist die Saite zu hoch, lassen Sie sie etwas unter den Ton ab und spannen Sie sie dann wieder.
- Geige, Bratsche oder Cello? Das Stimmgerät erkennt jeden Ton (Geige G D A E, Bratsche und Cello C G D A).
- Ihr Ensemble stimmt auf 442 Hz? Tippen Sie auf „A4 = 440 Hz“, um den Kammerton zu ändern.
- Startet das Mikrofon nicht? Erlauben Sie es in den Website-Einstellungen Ihres Browsers und tippen Sie erneut auf den Button.
"""
