[description]
other = """
Willkommen bei StringTune, dem einfachen Online-Stimmgerät. Erlauben Sie zuerst den Zugriff auf das Mikrofon und spielen Sie dann jede Saite einzeln. Das Stimmgerät erkennt automatisch die Tonhöhe und zeigt an, ob der Ton zu hoch oder zu tief ist. Stimmen Sie nach, bis die Anzeige genau in der Mitte steht. Gängige Stimmungen für Saiteninstrumente:

- Gitarre (Standardstimmung): E - A - D - G - H - E
- E-Bass (Standardstimmung): E - A - D - G
- Ukulele (Standardstimmung): G - C - E - A
- Geige: G - D - A - E
- Cello: C - G - D - A
- Bratsche: C - G - D - A
- Mandoline: G - D - A - E
- Banjo (5-saitig): G - D - G - H - D
"""
