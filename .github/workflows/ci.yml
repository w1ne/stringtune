name: CI

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run Markdown Lint
        run: npm run lint

  commit-lint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Validate current commit (last commit)
        if: github.event.pull_request.commits == 1
        run: npx commitlint --from ${{ github.event.pull_request.head.sha }}~1 --to ${{ github.event.pull_request.head.sha }} --verbose
      - name: Validate PR commits
        if: github.event.pull_request.commits > 1
        run: npx commitlint --from ${{ github.event.pull_request.head.sha }}~${{ github.event.pull_request.commits }} --to ${{ github.event.pull_request.head.sha }} --verbose

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.114.0'
          extended: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install site dependencies
        run: npm ci --prefix stringtune
      - name: Build
        run: |
          cd stringtune
          hugo --minify

  quality-checks:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.114.0'
          extended: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install site dependencies
        run: npm ci --prefix stringtune
      - name: Build Site
        run: |
          cd stringtune
          hugo --minify --baseURL /
      
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          configPath: './.lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true
  
  a11y:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.114.0'
          extended: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install site dependencies
        run: npm ci --prefix stringtune
      - name: Build Site
        run: |
          cd stringtune
          hugo --minify --baseURL http://localhost:8080/
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
      - name: Install pa11y-ci
        run: npm install -g pa11y-ci http-server
      - name: Run Accessibility Checks
        run: |
          npx http-server stringtune/public -p 8080 &
          sleep 5
          pa11y-ci --sitemap http://localhost:8080/sitemap.xml

  tuner-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: stringtune/package-lock.json
      - run: npm ci --prefix stringtune
      - run: node --test scripts/tests/*.test.cjs
      - run: npm test --prefix stringtune -- --runInBand
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path tuner-core/Cargo.toml
      - uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.114.0'
          extended: true
      - name: Build browser fixture
        working-directory: stringtune
        run: hugo --baseURL http://127.0.0.1:8094/
      - name: Install browser
        working-directory: stringtune
        run: npx playwright install --with-deps chromium
      - name: Verify browser flows
        run: |
          python3 -m http.server 8094 --bind 127.0.0.1 --directory stringtune/public &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8094/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-tuner.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tuner-mobile
          path: /tmp/stringtune-fixed-mobile.png
